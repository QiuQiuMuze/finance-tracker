<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home – Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Finance Summary</h1>

  <div id="summary">
    <p>Total Income: $<span id="total-income">0.00</span></p>
    <p>Total Expenses: $<span id="total-expense">0.00</span></p>
    <p>Balance: $<span id="balance">0.00</span></p>
    <p>Budget Limit: $<span id="budget-limit">0.00</span></p>
    <p id="over-budget-msg" class="error" hidden>⚠️ Budget Exceeded!</p>
  </div>

  <form id="budget-form">
    <input type="number" id="budget-amount" placeholder="Enter budget" required step="0.01" />
    <button type="button" id="budget-save">Save</button>
    <button type="button" id="budget-cancel">Cancel</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Amount</th><th>Type</th><th>Category</th><th>Date</th>
      </tr>
    </thead>
    <tbody id="transaction-table"></tbody>
  </table>

  <nav>
    <a href="add_transaction.html">Add Transaction</a> |
    <a href="settings.html">Settings</a> |
    <a href="index.html">Log Out</a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
