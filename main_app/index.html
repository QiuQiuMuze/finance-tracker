<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Track your finances with ease</h1>
  <p>This app helps you manage your income and expenses in one simple place.</p>
  <ul>
    <li>1. Add transactions and view history</li>
    <li>2. Get a balance update</li>
  </ul>

  <h2>Login</h2>
  <form id="login-form">
    <label>Username: <input type="text" id="username" required></label><br><br>
    <label>Password: <input type="password" id="password" required></label><br><br>
    <button type="submit">Log In</button>
    <p id="login-error" class="error"></p>
  </form>
  <p>Register here for free <a href="register.html">Sign Up</a></p>

  <script src="script.js"></script>
</body>
</html>
