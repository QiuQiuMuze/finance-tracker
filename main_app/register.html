<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Track your finances with ease</h1>
  <p>This app helps you manage your income and expenses in one simple place.</p>
  <ul>
    <li>1. Add transactions and view history</li>
    <li>2. Get a balance update</li>
  </ul>

  <h2>Sign Up</h2>
  <form id="register-form">
    <label>Username: <input type="text" id="reg-username" required></label><br><br>
    <label>Password: <input type="password" id="reg-password" required></label><br><br>
    <button type="submit">Create Account</button>
    <p id="register-msg" class="success"></p>
    <p id="register-error" class="error"></p>
  </form>
  <p><a href="index.html">← Back to Login</a></p>

  <script src="script.js"></script>
</body>
</html>
